<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept 3: Plant Organ Systems</title>
<style>
    :root {
        --bg:#0a0e1a; --panel:#151b2b; --card:#1e2640;
        --text:#e2e8f0; --muted:#94a3b8;
        --green:#10b981; --red:#ef4444; --blue:#3b82f6;
        --purple:#8b5cf6; --gold:#fbbf24;
    }
    * { box-sizing:border-box; margin:0; padding:0; user-select:none; }
    body { background:var(--bg); color:var(--text); font-family:'Segoe UI', Roboto, sans-serif;
        min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px;
        background-image: radial-gradient(circle at 30% 20%, rgba(16,185,129,0.1), transparent 50%),
                          radial-gradient(circle at 70% 80%, rgba(34,197,94,0.08), transparent 50%);
    }
    header { width:100%; max-width:950px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .back-btn { background:var(--panel); color:var(--muted); text-decoration:none; padding:10px 18px; border-radius:10px; font-weight:bold; border:1px solid rgba(255,255,255,0.1); font-size:0.9rem; transition:0.2s; }
    .back-btn:hover { color:white; background:#2a3450; }
    .hud { display:flex; gap:10px; }
    .hud-box { background:var(--panel); padding:10px 18px; border-radius:10px; font-weight:bold; font-size:0.9rem; border-bottom:3px solid var(--green); }
    .hud-box span { color:var(--gold); }

    .game-wrap { width:100%; max-width:950px; background:var(--panel); border-radius:20px; padding:30px; box-shadow:0 20px 50px rgba(0,0,0,0.6); border:1px solid rgba(16,185,129,0.2); }
    .progress-track { width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:10px; margin-bottom:25px; overflow:hidden; }
    .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#10b981,#3b82f6); transition:width 0.5s; }

    #start-screen, #results-screen { display:none; text-align:center; }
    #start-screen.active, #results-screen.active { display:block; }
    #start-screen h1, #results-screen h1 { font-size:2rem; margin-bottom:15px; background:linear-gradient(135deg,#10b981,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    #start-screen p, #results-screen p { color:var(--muted); font-size:1rem; line-height:1.6; max-width:640px; margin:0 auto 20px; }
    .icon-big { font-size:4rem; margin-bottom:10px; animation:sway 3s ease-in-out infinite; }
    @keyframes sway { 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} }
    .btn-primary { background:linear-gradient(135deg,#10b981,#3b82f6); color:white; border:none; padding:16px 45px; border-radius:50px; font-size:1.05rem; font-weight:bold; text-transform:uppercase; letter-spacing:1px; cursor:pointer; transition:0.2s; box-shadow:0 0 25px rgba(16,185,129,0.5); }
    .btn-primary:hover { transform:scale(1.05); }

    #play-screen { display:none; }
    #play-screen.active { display:block; }
    .q-tag { display:inline-block; background:rgba(16,185,129,0.15); color:#6ee7b7; padding:6px 16px; border-radius:20px; font-size:0.8rem; font-weight:bold; text-transform:uppercase; letter-spacing:2px; margin-bottom:15px; }
    .q-text { font-size:1.4rem; font-weight:600; margin-bottom:22px; line-height:1.4; }
    .options { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .option {
        background:var(--card); border:2px solid rgba(255,255,255,0.1); padding:18px;
        border-radius:12px; cursor:pointer; transition:0.2s; font-size:0.95rem; font-weight:600;
        text-align:center;
    }
    .option:hover { border-color:var(--green); transform:translateY(-3px); }
    .option.correct { background:rgba(16,185,129,0.25); border-color:var(--green); }
    .option.wrong { background:rgba(239,68,68,0.25); border-color:var(--red); }

    .feedback { display:none; padding:16px 20px; border-radius:12px; margin-bottom:15px; line-height:1.5; font-size:0.95rem; }
    .feedback.show { display:block; animation:slide 0.3s; }
    .feedback.ok { background:rgba(16,185,129,0.15); border-left:4px solid var(--green); }
    .feedback.bad { background:rgba(239,68,68,0.15); border-left:4px solid var(--red); }
    @keyframes slide { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }

    .next-btn { background:var(--purple); color:white; border:none; padding:12px 30px; border-radius:10px; font-weight:bold; cursor:pointer; display:none; font-size:0.95rem; transition:0.2s; }
    .next-btn.show { display:inline-block; }
    .next-btn:hover { background:#7c3aed; transform:scale(1.05); }

    .level-badge { font-size:4rem; margin:10px 0; }
    .level-title { font-size:1.6rem; font-weight:bold; color:var(--gold); margin-bottom:10px; }
    .score-big { font-size:3rem; font-weight:900; margin:15px 0; }
    .action-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px; }

    @media (max-width:600px) {
        .options { grid-template-columns:1fr; }
        .q-text { font-size:1.15rem; }
        .game-wrap { padding:20px; }
    }
</style>
</head>
<body>

<header>
    <a href="../index.html" class="back-btn">← Dashboard</a>
    <div class="hud">
        <div class="hud-box">Q: <span id="hud-q">0</span>/10</div>
        <div class="hud-box">Score: <span id="hud-score">0</span></div>
    </div>
</header>

<div class="game-wrap">
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>

    <div id="start-screen" class="active">
        <div class="icon-big">🌱</div>
        <h1>Plant Organ Systems</h1>
        <p>Plants have 4 major organ systems: <strong>Shoot</strong>, <strong>Root</strong>, <strong>Vascular</strong>, and <strong>Dermal</strong>. 
        Each system performs essential functions for the plant's survival. Master them all!</p>
        <button class="btn-primary" id="start-btn">Start Exploring</button>
    </div>

    <div id="play-screen">
        <div class="q-tag" id="q-tag">Question 1</div>
        <div class="q-text" id="q-text"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn">Next →</button>
    </div>

    <div id="results-screen">
        <div class="level-badge" id="level-badge">🌟</div>
        <h1 id="results-title">Concept Complete!</h1>
        <div class="level-title" id="level-title"></div>
        <div class="score-big" id="final-score">0/10</div>
        <p id="results-msg"></p>
        <div class="action-row">
            <button class="btn-primary" id="restart-btn">Retry Concept</button>
            <a href="../index.html" class="back-btn" style="padding:16px 30px;">← Dashboard</a>
        </div>
    </div>
</div>

<script>
const questions = [
    { q:"Which plant system includes leaves, stems, and flowers?",
      options:["Root System","Shoot System","Vascular System","Dermal System"], correct:1,
      explain:"The Shoot System is the above-ground part — leaves (photosynthesis), stems (support), and flowers (reproduction)."
    },
    { q:"What is the main function of the Root System?",
      options:["Photosynthesis","Anchor the plant and absorb water/minerals","Produce flowers","Gas exchange"], correct:1,
      explain:"Roots anchor the plant AND absorb water and minerals through root hairs — the plant's intake system."
    },
    { q:"Which vascular tissue transports WATER upward from roots?",
      options:["Phloem","Xylem","Stomata","Cuticle"], correct:1,
      explain:"Xylem = water transport (up). Phloem = sugar transport (down and around). Remember: X for water eXtra-important!"
    },
    { q:"What does the Dermal System include?",
      options:["Roots and root hairs","Epidermis and cuticle","Xylem and phloem","Leaves and flowers"], correct:1,
      explain:"The Dermal System is the outer covering — epidermis (skin) and cuticle (waxy layer) for protection and water retention."
    },
    { q:"Where does photosynthesis mainly occur?",
      options:["Roots","Leaves","Stems only","Flowers"], correct:1,
      explain:"Leaves are the main photosynthetic organs — they contain chloroplasts that capture sunlight."
    },
    { q:"Which vascular tissue transports SUGARS made in leaves?",
      options:["Xylem","Phloem","Epidermis","Cuticle"], correct:1,
      explain:"Phloem transports sugars (food) from leaves to other parts of the plant — the 'food highway.'"
    },
    { q:"What is the function of root hairs?",
      options:["Photosynthesis","Increase surface area for water/mineral absorption","Support the flower","Gas exchange"], correct:1,
      explain:"Root hairs are tiny extensions that massively increase surface area — boosting water and mineral uptake."
    },
    { q:"What role does the cuticle play in the Dermal System?",
      options:["Transports water","Waxy waterproof coating to prevent water loss","Produces flowers","Anchors the plant"], correct:1,
      explain:"The cuticle is a waxy layer on leaves and stems — it prevents excessive water loss (transpiration)."
    },
    { q:"How does the Shoot System help reproduction?",
      options:["Through roots","Through flowers and fruits","Through xylem","Through root hairs"], correct:1,
      explain:"Flowers contain reproductive organs. Fruits protect seeds and aid dispersal — a key part of the Shoot System."
    },
    { q:"Why must all 4 plant systems work together?",
      options:["They don't need to work together","They collectively maintain the plant's life and homeostasis","Only the Root System matters","Only photosynthesis matters"], correct:1,
      explain:"Roots absorb, shoot photosynthesizes, vascular transports, dermal protects — all TOGETHER maintain life and homeostasis!"
    }
];

let state={idx:0,score:0,answered:false};
const D={
    start:document.getElementById('start-screen'),
    play:document.getElementById('play-screen'),
    results:document.getElementById('results-screen'),
    startBtn:document.getElementById('start-btn'),
    restartBtn:document.getElementById('restart-btn'),
    nextBtn:document.getElementById('next-btn'),
    qTag:document.getElementById('q-tag'),
    qText:document.getElementById('q-text'),
    options:document.getElementById('options'),
    feedback:document.getElementById('feedback'),
    hudQ:document.getElementById('hud-q'),
    hudScore:document.getElementById('hud-score'),
    prog:document.getElementById('prog'),
    levelBadge:document.getElementById('level-badge'),
    levelTitle:document.getElementById('level-title'),
    finalScore:document.getElementById('final-score'),
    resultsMsg:document.getElementById('results-msg')
};

let audioCtx;
function beep(f,d,t='sine',v=0.15){
    try{
        if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);o.type=t;o.frequency.value=f;
        g.gain.setValueAtTime(v,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
        o.start();o.stop(audioCtx.currentTime+d);
    }catch(e){}
}
const sfx={click:()=>beep(500,0.08,'triangle',0.1),ok:()=>{beep(600,0.12);setTimeout(()=>beep(900,0.15),100);},bad:()=>beep(150,0.3,'sawtooth',0.15),done:()=>{beep(500,0.15);setTimeout(()=>beep(700,0.15),150);setTimeout(()=>beep(1000,0.3),300);}};

function startGame(){
    state={idx:0,score:0,answered:false};
    D.start.classList.remove('active');
    D.results.classList.remove('active');
    D.play.classList.add('active');
    D.hudScore.textContent=0;
    loadQ();
}

function loadQ(){
    if(state.idx>=questions.length){return endGame();}
    state.answered=false;
    const q=questions[state.idx];
    D.qTag.textContent=`Question ${state.idx+1}`;
    D.qText.textContent=q.q;
    D.hudQ.textContent=state.idx+1;
    D.prog.style.width=`${(state.idx/questions.length)*100}%`;
    D.options.innerHTML='';
    D.feedback.className='feedback';
    D.nextBtn.classList.remove('show');

    q.options.forEach((opt,i)=>{
        const el=document.createElement('div');
        el.className='option';
        el.textContent=opt;
        el.addEventListener('click',()=>answer(i));
        D.options.appendChild(el);
    });
}

function answer(i){
    if(state.answered) return;
    state.answered=true;
    const q=questions[state.idx];
    const isRight=i===q.correct;

    document.querySelectorAll('.option').forEach((o,idx)=>{
        o.style.pointerEvents='none';
        if(idx===q.correct) o.classList.add('correct');
        else if(idx===i) o.classList.add('wrong');
    });

    if(isRight){
        sfx.ok(); state.score++;
        D.hudScore.textContent=state.score;
        D.feedback.className='feedback show ok';
        D.feedback.innerHTML=`✅ <strong>Correct!</strong> ${q.explain}`;
    }else{
        sfx.bad();
        D.feedback.className='feedback show bad';
        D.feedback.innerHTML=`❌ <strong>Not quite.</strong> ${q.explain}`;
    }

    D.nextBtn.classList.add('show');
    D.nextBtn.textContent=state.idx<questions.length-1?'Next →':'See Results →';
}

D.nextBtn.addEventListener('click',()=>{sfx.click();state.idx++;if(state.idx>=questions.length)endGame();else loadQ();});

function endGame(){
    D.play.classList.remove('active');
    D.results.classList.add('active');
    D.prog.style.width='100%';
    D.finalScore.textContent=`${state.score}/${questions.length}`;
    const pct=state.score/questions.length;
    let badge,title,msg;
    if(pct>=0.85){badge='🌳';title='Botany Master!';msg='You understand plant systems deeply! Excellent botanical knowledge.';}
    else if(pct>=0.6){badge='🌿';title='Green Thumb';msg='You know most plant systems. Review the ones you missed to master botany.';}
    else{badge='🌱';title='Sprouting Botanist';msg='Keep growing! Each plant system has unique functions that work together for the plant\'s survival.';}
    D.levelBadge.textContent=badge;
    D.levelTitle.textContent=title;
    D.resultsMsg.textContent=msg;
    sfx.done();
}

D.startBtn.addEventListener('click',()=>{sfx.click();startGame();});
D.restartBtn.addEventListener('click',()=>{sfx.click();startGame();});
</script>
</body>
</html>
